<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>انجمن ادیتوران | نسخه تستی فیزون</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Vazirmatn -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Vazirmatn', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            dark: '#ffffff',
                            card: 'rgba(255, 255, 255, 0.85)',
                            neon: '#000F9F',
                            neonBlue: '#0000A0',
                            glow: 'rgba(0, 15, 159, 0.15)',
                        }
                    },
                    boxShadow: {
                        'neon-glow': '0 0 20px rgba(0, 15, 159, 0.2)',
                        'neon-glow-lg': '0 0 35px rgba(0, 15, 159, 0.3)',
                        'neon-glow-btn': '0 0 18px rgba(0, 15, 159, 0.4)',
                        'card-glow': '0 0 25px rgba(0, 0, 160, 0.12)',
                    },
                    animation: {
                        'pulse-glow': 'pulseGlow 3s infinite alternate',
                        'float': 'float 5s ease-in-out infinite',
                    },
                    keyframes: {
                        pulseGlow: {
                            '0%': { boxShadow: '0 0 12px rgba(0, 15, 159, 0.15)' },
                            '100%': { boxShadow: '0 0 28px rgba(0, 15, 159, 0.35)' },
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-6px)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* ۱. تعریف فونت فارسی - مربع بلک */
        @font-face {
            font-family: 'MorabbaBlack';
            src: url('fonts/مربع بلک [@Font_SaRaSaRi].woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        /* ۲. تعریف فونت انگلیسی - پارسا */
        @font-face {
            font-family: 'ParsaFont';
            src: url('fonts/Parsa [@Font_SaRaSaRi](1).woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        /* ۳. کلاس‌های اختصاصی فونت‌ها */
        .font-morabba {
            font-family: 'MorabbaBlack', 'Vazirmatn', sans-serif !important;
        }

        .font-parsa {
            font-family: 'ParsaFont', sans-serif !important;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: #ffffff;
            color: #000F9F;
            overflow-x: hidden;
        }

        .ambient-bg {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            pointer-events: none;
            z-index: 0;
        }

        .ambient-1 {
            width: 320px;
            height: 320px;
            top: -50px;
            right: -50px;
            background: radial-gradient(circle, rgba(0, 15, 159, 0.08) 0%, rgba(255, 255, 255, 0) 70%);
        }

        .ambient-2 {
            width: 300px;
            height: 300px;
            top: 350px;
            left: -80px;
            background: radial-gradient(circle, rgba(3, 11, 184, 0.08) 0%, rgba(255, 255, 255, 0) 70%);
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 15, 159, 0.15);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 15, 159, 0.2);
        }

        .text-glow {
            text-shadow: 0 0 12px rgba(0, 15, 159, 0.15);
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #ffffff;
        }
        ::-webkit-scrollbar-thumb {
            background: #000F9F;
            border-radius: 3px;
        }

        .slider-item {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
</head>
<body class="min-h-screen relative selection:bg-[#000F9F] selection:text-white">

    <div class="ambient-bg ambient-1"></div>
    <div class="ambient-bg ambient-2"></div>

    <div class="relative z-10 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pb-16">

        <header class="py-4 sm:py-6 mb-6 sm:mb-8 flex items-center justify-between border-b border-[#000F9F]/15">
            
            <div class="flex items-center space-x-2.5 space-x-reverse cursor-pointer group">
                <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-gradient-to-tr from-[#000F9F] to-[#030BB8] flex items-center justify-center shadow-neon-glow shrink-0 overflow-hidden">
                    <img src="IMG_20260821_170831_475.png" alt="لوگوی انجمن ادیتوران" class="w-full h-full object-cover">
                </div>
                <div class="flex flex-col">
                    <span class="font-morabba text-lg sm:text-xl font-black tracking-wide text-[#000F9F] translate-y-1">
                        انجمن <span class="text-[#030BB8]">ادیتوران بیباک</span>
                    </span>
                    <span class="font-parsa text-lg sm:text-xl text-[#0000A0] font-bold tracking-widest">Bibak Editors Guild</span>
                </div>
            </div>

            <button aria-label="منو" class="glass-panel p-2 sm:p-2.5 rounded-xl text-[#000F9F] border border-[#000F9F]/30 active:scale-95 transition-transform duration-200">
                <svg class="w-5 h-5 sm:w-6 sm:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path>
                </svg>
            </button>
        </header>

        <main class="flex flex-col items-center text-center mt-2 sm:mt-6">

            <!-- کادر شناور اصلی -->
            <div class="w-full max-w-3xl glass-card rounded-2xl sm:rounded-3xl p-6 sm:p-8 shadow-card-glow border border-[#000F9F]/30 relative overflow-hidden animate-float mb-6 sm:mb-8 flex flex-col items-center">
                
                <div class="absolute -top-20 -right-20 w-36 h-36 bg-[#000F9F]/10 rounded-full blur-2xl pointer-events-none"></div>

                <div class="w-full max-w-xs mb-4 sm:mb-6 rounded-xl overflow-hidden shadow-neon-glow border border-[#000F9F]/20">
                    <img src="photos/typo simple1.jpg" alt="Typo Simple" class="w-full h-auto object-cover">
                </div>

                <h1 class="text-2xl sm:text-4xl lg:text-5xl font-black leading-snug sm:leading-snug max-w-4xl mb-3 sm:mb-4 text-glow px-2 text-[#000F9F]">
                    اینجاخلاقیت تبدیل به هنر می‌شود
                </h1>

                <p class="text-xs sm:text-sm text-[#0000A0]/80 font-medium max-w-xl px-4 leading-relaxed">
                    بیش از یک انجمن یک مسیر مشترک برای رشد.<br>
                    ما اینجا دور هم جمع شده‌ایم تا از کیفیت کارهای گرافیک و تدوین در بازار بهتر کنیم و مسیر حرفه‌ای‌مان را پیدا کنیم.
                </p>
            </div>

            <!-- کادر جستجو -->
            <div class="w-full max-w-2xl mb-10 sm:mb-12 px-2">
                <div class="relative flex items-center glass-panel rounded-xl sm:rounded-2xl border border-[#000F9F]/30 p-1.5 sm:p-2">
                    <div class="pr-3 text-[#000F9F] shrink-0">
                        <svg class="w-5 h-5 sm:w-6 sm:h-6 drop-shadow-[0_0_8px_rgba(0,15,159,0.3)]" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                        </svg>
                    </div>
                    <input type="text" 
                           placeholder="جستجو در اساتید، دوره‌ها و پروژه‌ها..." 
                           class="w-full bg-transparent text-[#000F9F] placeholder-[#0000A0]/60 text-xs sm:text-base px-2 py-2 focus:outline-none"
                           readonly>
                </div>
            </div>

            <!-- کادر اسلایدر (بهینه‌شده برای موبایل) -->
            <div class="w-full max-w-4xl glass-card rounded-2xl sm:rounded-3xl p-3 sm:p-10 shadow-card-glow border border-[#000F9F]/30 relative overflow-hidden">
                <div class="absolute -bottom-20 -right-20 w-48 h-48 bg-[#000F9F]/10 rounded-full blur-2xl pointer-events-none"></div>

                <div class="relative flex items-center justify-between gap-1 sm:gap-6 py-2 sm:py-4 min-h-[160px] sm:min-h-[300px]">

                    <!-- اسلاید راست -->
                    <div class="slider-item flex-1 flex flex-col items-center select-none">
                        <div class="w-12 h-12 sm:w-28 sm:h-28 rounded-xl sm:rounded-2xl border border-[#000F9F]/30 shadow-sm mb-1.5 sm:mb-3 bg-[#000F9F]/5 flex items-center justify-center">
                            <span class="text-[10px] sm:text-base font-bold text-[#000F9F]">عکس</span>
                        </div>
                        <span id="name-right" class="text-[10px] sm:text-base font-bold text-[#000F9F] truncate max-w-[70px] sm:max-w-none"></span>
                    </div>

                    <!-- فلش سمت راست -->
                    <button id="prev-btn" aria-label="قبلی" class="glass-panel p-1.5 sm:p-3 rounded-full text-[#000F9F] border border-[#000F9F]/30 hover:bg-[#000F9F] hover:text-white transition-all duration-300 shadow-neon-btn shrink-0 active:scale-95 z-20">
                        <svg class="w-4 h-4 sm:w-6 sm:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"></path>
                        </svg>
                    </button>

                    <!-- اسلاید وسط -->
                    <div class="slider-item flex-1 flex flex-col items-center justify-center z-10 select-none">
                        <div class="w-20 h-20 sm:w-40 sm:h-40 rounded-2xl sm:rounded-3xl border-2 border-[#000F9F] shadow-neon-glow mb-2 sm:mb-4 bg-[#000F9F]/10 flex items-center justify-center">
                            <span class="text-sm sm:text-2xl font-black text-[#000F9F]">عکس</span>
                        </div>
                        <span id="name-center" class="text-xs sm:text-xl font-black text-[#000F9F] text-glow truncate max-w-[90px] sm:max-w-none"></span>
                    </div>

                    <!-- فلش سمت چپ -->
                    <button id="next-btn" aria-label="بعدی" class="glass-panel p-1.5 sm:p-3 rounded-full text-[#000F9F] border border-[#000F9F]/30 hover:bg-[#000F9F] hover:text-white transition-all duration-300 shadow-neon-btn shrink-0 active:scale-95 z-20">
                        <svg class="w-4 h-4 sm:w-6 sm:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"></path>
                        </svg>
                    </button>

                    <!-- اسلاید چپ -->
                    <div class="slider-item flex-1 flex flex-col items-center select-none">
                        <div class="w-12 h-12 sm:w-28 sm:h-28 rounded-xl sm:rounded-2xl border border-[#000F9F]/30 shadow-sm mb-1.5 sm:mb-3 bg-[#000F9F]/5 flex items-center justify-center">
                            <span class="text-[10px] sm:text-base font-bold text-[#000F9F]">عکس</span>
                        </div>
                        <span id="name-left" class="text-[10px] sm:text-base font-bold text-[#000F9F] truncate max-w-[70px] sm:max-w-none"></span>
                    </div>

                </div>
            </div>

        </main>
    </div>

    <!-- اسکریپت کنترل اسلایدر -->
    <script>
        const items = [
            { name: "استاد رضایی" },
            { name: "استاد متین" },
            { name: "استاد شجریان" }
        ];

        let currentIndex = 0;
        let autoSlideTimer = null;

        function updateCarousel() {
            const total = items.length;
            
            const centerIdx = currentIndex;
            const rightIdx = (currentIndex - 1 + total) % total;
            const leftIdx = (currentIndex + 1) % total;

            document.getElementById('name-center').textContent = items[centerIdx].name;
            document.getElementById('name-right').textContent = items[rightIdx].name;
            document.getElementById('name-left').textContent = items[leftIdx].name;
        }

        function nextSlide() {
            currentIndex = (currentIndex + 1) % items.length;
            updateCarousel();
        }

        function prevSlide() {
            currentIndex = (currentIndex - 1 + items.length) % items.length;
            updateCarousel();
        }

        function startAutoSlide() {
            stopAutoSlide();
            autoSlideTimer = setInterval(nextSlide, 7000);
        }

        function stopAutoSlide() {
            if (autoSlideTimer) clearInterval(autoSlideTimer);
        }

        document.getElementById('next-btn').addEventListener('click', () => {
            nextSlide();
            startAutoSlide();
        });

        document.getElementById('prev-btn').addEventListener('click', () => {
            prevSlide();
            startAutoSlide();
        });

        updateCarousel();
        startAutoSlide();
    </script>
</body>
</html>
